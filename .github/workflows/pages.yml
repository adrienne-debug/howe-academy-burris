# Deploys this family's app to GitHub Pages on every push to main, through GitHub Actions instead of the
# "deploy from a branch" builder, which has stalled for an hour or more several times (2026-11-11 among them).
# configure-pages with enablement:true switches the repo's Pages source to this workflow on its first run, so
# nothing has to be clicked in Settings — here or in a new family's repo made from this one.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
